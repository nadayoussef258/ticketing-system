<!-- shared/components/navbar/navbar.component.html -->
<nav class="app-navbar d-flex align-items-center justify-content-between">

  <div class="d-flex align-items-center gap-4">
    <a class="navbar-brand" href="#">
      <i class="bi bi-headset"></i>
      IT Support
    </a>

    <!-- Admin nav links -->
    <div class="nav-links" *ngIf="isAdminRole">
      <a routerLink="/admin/dashboard" routerLinkActive="active" class="nav-link-item">
        <i class="bi bi-grid-3x3-gap me-1"></i>Tickets
      </a>
      <a routerLink="/admin/projects" routerLinkActive="active" class="nav-link-item">
        <i class="bi bi-folder me-1"></i>Projects
      </a>
      <a routerLink="/admin/team" routerLinkActive="active" class="nav-link-item">
        <i class="bi bi-people me-1"></i>Team
      </a>
      <a routerLink="/admin/logs" routerLinkActive="active" class="nav-link-item">
  <i class="bi bi-clock-history me-1"></i>Logs
</a>
    </div>
  </div>

  <div class="d-flex align-items-center gap-3">
    <span class="org-label" *ngIf="orgName">
      <i class="bi bi-building me-1"></i>{{ orgName }}
    </span>

    <!-- Notification bell -->
      <div class="notif-wrap" *ngIf="isAdminRole">
      <button class="btn-bell" (click)="toggleDropdown()">
        <i class="bi bi-bell"></i>
        <span class="notif-badge" *ngIf="notificationSvc.unreadCount() > 0">
          {{ notificationSvc.unreadCount() > 9 ? '9+' : notificationSvc.unreadCount() }}
        </span>
      </button>

      <div class="notif-dropdown" *ngIf="showDropdown">
        <div class="notif-header">
          <span>Notifications</span>
          <button class="notif-mark-all" *ngIf="notificationSvc.unreadCount() > 0" (click)="markAllRead()">
            Mark all read
          </button>
        </div>

        <div class="notif-list">
          <div *ngIf="notificationSvc.notifications().length === 0" class="notif-empty">
            <i class="bi bi-bell-slash"></i>
            <p>No notifications yet</p>
          </div>

          <div *ngFor="let n of notificationSvc.notifications()"
               class="notif-item" [class.unread]="!n.is_read"
               (click)="onNotificationClick(n)">
            <div class="notif-dot" *ngIf="!n.is_read"></div>
            <div class="notif-content">
              <div class="notif-title">{{ n.title }}</div>
              <div class="notif-body" *ngIf="n.body">{{ n.body }}</div>
              <div class="notif-time">{{ n.created_at | date:'MMM d · h:mm a' }}</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <span class="role-pill">{{ roleLabel }}</span>
    <button class="btn-logout" (click)="logout()">
      <i class="bi bi-box-arrow-right"></i>Logout
    </button>
  </div>

</nav>
