<div class="login-page d-flex align-items-center justify-content-center min-vh-100">
  <div class="login-card">

    <div class="text-center mb-5">
      <div class="brand-icon mx-auto mb-4">
        <i class="bi bi-headset"></i>
      </div>
      <h1 class="login-title">IT Support Portal</h1>
      <p class="login-sub">Sign in to access your support tickets</p>
    </div>

    <div class="error-alert" *ngIf="error()">
      <i class="bi bi-exclamation-triangle me-2"></i>{{ error() }}
    </div>

    <form (ngSubmit)="onLogin()" #loginForm="ngForm">
      <div class="mb-4">
        <label class="field-label">Email address</label>
        <div class="input-wrap">
          <i class="bi bi-envelope input-icon"></i>
          <input
            type="email"
            class="field-input"
            placeholder="you@company.com"
            [(ngModel)]="email"
            name="email"
            required
            [disabled]="loading()"
          />
        </div>
      </div>

      <div class="mb-5">
        <label class="field-label">Password</label>
        <div class="input-wrap">
          <i class="bi bi-lock input-icon"></i>
          <input
            [type]="showPassword ? 'text' : 'password'"
            class="field-input has-toggle"
            placeholder="••••••••"
            [(ngModel)]="password"
            name="password"
            required
            [disabled]="loading()"
          />
          <button type="button" class="eye-btn" (click)="showPassword = !showPassword">
            <i class="bi" [class.bi-eye]="!showPassword" [class.bi-eye-slash]="showPassword"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-signin" [disabled]="loading() || !email || !password">
        <span *ngIf="loading()" class="spinner-border spinner-border-sm me-2"></span>
        {{ loading() ? 'Signing in...' : 'Sign in' }}
      </button>
    </form>

  </div>
</div>
