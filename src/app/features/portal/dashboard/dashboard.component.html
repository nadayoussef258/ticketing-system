<app-navbar [orgName]="auth.user()?.project_name ?? ''" role="user" />

<div class="page-bg min-vh-100">
  <div class="container-fluid px-4 py-4" style="max-width: 960px; margin: 0 auto;">

    <!-- Header -->
    <div class="d-flex align-items-center justify-content-between mb-4">
      <div>
        <h1 class="page-title mb-0">My Tickets</h1>
        <p class="page-sub mb-0">{{ auth.user()?.project_name }}</p>
      </div>
      <a routerLink="/portal/new-ticket" class="btn-new">
        <i class="bi bi-plus-lg me-1"></i>New Ticket
      </a>
    </div>

    <!-- Stats -->
    <div class="row g-3 mb-4">
      <div class="col-6 col-md-3" *ngFor="let stat of stats">
        <div class="stat-card">
          <div class="stat-label">{{ stat.label }}</div>
          <div class="stat-value" [style.color]="stat.color">{{ stat.count }}</div>
        </div>
      </div>
    </div>

    <!-- Loading -->
    <div class="text-center py-5" *ngIf="loading()">
      <div class="spinner-border" style="color: #4f46e5;"></div>
      <p class="text-muted mt-2 small">Loading tickets...</p>
    </div>

    <!-- Empty -->
    <div class="empty-state" *ngIf="!loading() && tickets().length === 0">
      <i class="bi bi-ticket-perforated"></i>
      <h6>No tickets yet</h6>
      <p>Submit your first support request</p>
      <a routerLink="/portal/new-ticket" class="btn-empty">Open a ticket</a>
    </div>

    <!-- Tickets list -->
    <div *ngIf="!loading() && tickets().length > 0">
   <a   
        *ngFor="let ticket of tickets()"
        [routerLink]="['/portal/ticket', ticket.id]"
        class="ticket-card d-flex align-items-center gap-3 mb-2 text-decoration-none"
        [class.has-reply]="ticketsWithNewReply().has(ticket.id)"
      >
        <div class="ticket-icon-wrap">
          <i class="bi bi-ticket-perforated"></i>
        </div>

        <div class="flex-grow-1 min-w-0">
          <div class="d-flex align-items-center gap-2 mb-1 flex-wrap">
            <span class="ticket-title">{{ ticket.subject }}</span>
            <span *ngIf="ticketsWithNewReply().has(ticket.id)" class="new-reply-badge">
              <i class="bi bi-chat-dots-fill me-1"></i>New reply
            </span>
          </div>
          <div class="d-flex align-items-center gap-2 flex-wrap">
            <app-priority-badge [priority]="ticket.priority" />
            <app-status-badge [status]="ticket.status" />
            <span class="ticket-date">{{ ticket.created_at | date:'MMM d, y' }}</span>
          </div>
        </div>

        <i class="bi bi-chevron-right text-muted"></i>
      </a>
    </div>

  </div>
</div>
